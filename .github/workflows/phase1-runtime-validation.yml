name: Phase 1 frozen model runtime validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Capture repository integrity baseline
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path.cwd()
          hashes = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file() and '.git' not in p.relative_to(root).parts}
          (Path(os.environ['RUNNER_TEMP']) / 'phase1-integrity-before.json').write_text(json.dumps(hashes))
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.5'
          architecture: x64
      - name: Create clean environment and install pinned runtime
        run: |
          python -B -m venv "$RUNNER_TEMP/phase1-venv"
          "$RUNNER_TEMP/phase1-venv/bin/python" -B -m pip --isolated install --no-cache-dir pip==25.1.1
          "$RUNNER_TEMP/phase1-venv/bin/python" -B -m pip --isolated install --require-hashes --only-binary=:all: --no-cache-dir \
            --report "$RUNNER_TEMP/phase1-install-linux.json" -r production/phase1/requirements.lock
          "$RUNNER_TEMP/phase1-venv/bin/python" -B -m pip check
          "$RUNNER_TEMP/phase1-venv/bin/python" -B -m pip freeze > "$RUNNER_TEMP/phase1-freeze-linux.txt"
      - name: Verify artifacts, features and Windows Linux parity
        run: |
          "$RUNNER_TEMP/phase1-venv/bin/python" -B production/phase1/validate_runtime.py \
            --require-linux --output "$RUNNER_TEMP/phase1-validation-linux.json"
      - name: Verify final repository integrity
        if: always()
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          before = json.loads((Path(os.environ['RUNNER_TEMP']) / 'phase1-integrity-before.json').read_text())
          after = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in root.rglob('*') if p.is_file() and '.git' not in p.relative_to(root).parts}
          changed = sorted(k for k in before.keys() | after.keys() if before.get(k) != after.get(k))
          git_status = subprocess.check_output(['git', '--no-optional-locks', 'status', '--porcelain=v1', '--untracked-files=all'], text=True)
          result = {'changed_files': changed, 'git_status': git_status,
                    'status': 'FAIL' if changed or git_status else 'PASS'}
          (Path(os.environ['RUNNER_TEMP']) / 'phase1-integrity-linux.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          if result['status'] != 'PASS':
              raise SystemExit(1)
          PY
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase1-runtime-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/phase1-install-linux.json
            ${{ runner.temp }}/phase1-freeze-linux.txt
            ${{ runner.temp }}/phase1-validation-linux.json
            ${{ runner.temp }}/phase1-integrity-linux.json
            ${{ runner.temp }}/phase1-integrity-before.json
